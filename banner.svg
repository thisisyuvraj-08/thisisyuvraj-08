<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="55%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1c2536" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect width="900" height="300" rx="18" fill="url(#grid)"/>
  <rect width="900" height="300" rx="18" fill="url(#vignette)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#26314a" stroke-width="1.5"/>

  <!-- floating accent nodes -->
  <circle cx="80" cy="60" r="3" fill="#00f5d4" opacity="0.8">
    <animate attributeName="cy" values="60;50;60" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="240" r="3" fill="#a78bfa" opacity="0.8">
    <animate attributeName="cy" values="240;230;240" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="55" r="2.5" fill="#58a6ff" opacity="0.7">
    <animate attributeName="cx" values="850;838;850" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- window chrome -->
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>
  <text x="450" y="33" text-anchor="middle" class="mono" font-size="12" fill="#5b6879">yuvraj@dev-machine — zsh</text>
  <line x1="0" y1="48" x2="900" y2="48" stroke="#1f2735" stroke-width="1"/>

  <!-- glowing name -->
  <text x="60" y="140" class="mono" font-size="52" font-weight="700" fill="url(#glow)" filter="url(#soft)">
    Yuvraj Singh Jakhar
  </text>
  <text x="60" y="140" class="mono" font-size="52" font-weight="700" fill="url(#glow)">
    Yuvraj Singh Jakhar
  </text>

  <rect x="61" y="158" width="0" height="3" fill="url(#accent)">
    <animate attributeName="width" values="0;540;540" keyTimes="0;0.6;1" dur="2.4s" fill="freeze"/>
  </rect>

  <text x="61" y="195" class="mono" font-size="19" fill="#8fa1c7">
    Software Engineer · Robotics Builder · AI/ML Explorer
  </text>

  <text x="61" y="230" class="mono" font-size="16" fill="#5b6879">
    <tspan fill="#00f5d4">$</tspan> building things that move, think, and occasionally crash gracefully ⚽
  </text>

  <g class="mono" font-size="18" fill="#c9d1d9">
    <text x="61" y="264"><tspan fill="#58a6ff">$</tspan> _
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
