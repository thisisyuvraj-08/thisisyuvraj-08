<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .prompt { fill: #58a6ff; }
      .out { fill: #7ee787; }
      .txt { fill: #c9d1d9; }
      .dim { fill: #8b949e; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="220" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- window controls -->
  <circle cx="28" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="26" r="6" fill="#27c93f"/>
  <text x="450" y="31" text-anchor="middle" class="mono dim" font-size="13">yuvraj@dev-machine: ~</text>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#30363d" stroke-width="1"/>

  <g class="mono" font-size="18">
    <text x="26" y="80"><tspan class="prompt">$ </tspan><tspan class="txt">whoami</tspan></text>
    <text x="26" y="108" class="out">Yuvraj Singh Jakhar — Software Engineer / Robotics Builder / AI-ML Explorer</text>

    <text x="26" y="146"><tspan class="prompt">$ </tspan><tspan class="txt">cat focus.log</tspan></text>
    <text x="26" y="174" class="out">building software, hardware for robots, and models that learn.</text>

    <text x="26" y="200"><tspan class="prompt">$ </tspan><tspan class="txt">_</tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
